name: Set Pages custom domain (one-off)

# 一次性：把仓库的 Pages 自定义域名设为 fifa.datamenu.xyz
# 背景：本仓库用 actions/deploy-pages 部署，根目录 CNAME 文件不会被 Pages 设置采纳，
#      必须调 PUT /repos/{owner}/{repo}/pages 写入 cname。
# 跑完即可删除本文件。

on:
  push:
    paths:
      - '.github/workflows/set-custom-domain.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  set-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Set custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Setting Pages custom domain to fifa.datamenu.xyz for $REPO"
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"cname":"fifa.datamenu.xyz"}')
          echo "HTTP $code"
          cat /tmp/resp.json
          if [ "$code" -ge 300 ]; then exit 1; fi
      - name: Read back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" | head -c 800
